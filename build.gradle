// Minecraft 26.1 stopped being obfuscated, which split the toolchain in two: 26.x needs the
// non-remapping Loom plugin and has no mappings, while 1.21.x and older need the remapping one with
// Yarn. The two also disagree about the name of nearly every class in the game, so the source is
// split as well — src/shared holds everything that never touches Minecraft, and one variant source
// set supplies the rest.
plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.19' apply false
	id 'net.fabricmc.fabric-loom-remap' version '1.17.19' apply false
	id 'maven-publish'
}

def unobfuscated = !project.minecraft_version.startsWith('1.')
// 1.20.x predates the Click/KeyInput input records, so its screens need their own sources.
// Versions still on mouseClicked(double, double, int) rather than the Click record 1.21.9
// introduced. Listed rather than matched on a prefix, because '1.21.1' is a prefix of
// '1.21.11', which is on the new API.
def legacyInput = ['1.20.6', '1.21.1'].contains(project.minecraft_version)
// 1.20.1 predates ServerInfo.Status, drawGuiTexture and the moved screen packages.
def oldest = project.minecraft_version == '1.20.1'
def variant = unobfuscated ? 'mc26' : (oldest ? 'mc1201' : (legacyInput ? 'mc120' : 'mc121'))

// Whatever Java the target ships with. Building 1.20.1 at 21 produced class files its own runtime
// refuses to load, so the mod installed and then failed at launch with an UnsupportedClassVersionError.
def javaRelease = unobfuscated ? 25 : (oldest ? 17 : 21)

apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

sourceSets {
	main {
		java.srcDirs = ["src/shared/java", "src/${variant}/java"]
		resources.srcDirs = ['src/main/resources']
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	if (unobfuscated) {
		// No mappings exist, and none are needed — the jar already carries real names.
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	} else {
		mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	inputs.property "java_version", javaRelease

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version,
				"java_version": javaRelease
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		// One toolchain compiles them all; release above is what decides the bytecode level.
		languageVersion = JavaLanguageVersion.of(unobfuscated ? 25 : 21)
	}
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
